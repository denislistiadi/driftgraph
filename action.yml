name: 'Driftgraph'
description: 'Automated architecture visualizer and gatekeeper for Pull Requests'
author: 'Denis Listiadi'
branding:
  icon: 'git-merge'
  color: 'blue'
inputs:
  github-token:
    description: 'GitHub token for reading PR data and posting comments'
    required: true
  rules-file:
    description: 'Path to architecture rules file, relative to the repository root.'
    required: false
    default: '.driftgraph.yml'
  rules-source:
    description: 'Read architecture rules from the base branch (recommended) or the PR head.'
    required: false
    default: 'base'
runs:
  using: 'node24'
  main: 'dist/index.js'
